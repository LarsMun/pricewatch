sentry:
    dsn: '%env(SENTRY_DSN)%'
    options:
        environment: '%kernel.environment%'
        release: '%env(default::APP_VERSION)%'
        send_default_pii: false
        # Sample rate for performance monitoring (0.0 - 1.0)
        traces_sample_rate: 0.2

when@dev:
    sentry:
        dsn: null  # Disable Sentry in dev

when@test:
    sentry:
        dsn: null  # Disable Sentry in test
