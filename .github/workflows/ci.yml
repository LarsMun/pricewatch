name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (PHP 8.3)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, xml, zip, intl, bcmath, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create .env file and JWT keys
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=ci-test-secret-not-for-production" >> .env
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env
          echo "DEFAULT_URI=http://localhost:8100" >> .env
          echo "CORS_ALLOW_ORIGIN='^https?://localhost(:[0-9]+)?$'" >> .env
          echo "MAILER_DSN=null://null" >> .env
          echo "SENTRY_DSN=" >> .env
          echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env
          # Generate JWT keys for testing
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem 2>/dev/null
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env
          echo "JWT_PASSPHRASE=" >> .env

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer dump-autoload --optimize

      - name: Check for security vulnerabilities
        run: composer audit

      - name: Run PHPUnit unit tests
        run: ./vendor/bin/phpunit --testdox --testsuite Unit

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # Optional: Run both jobs in parallel and require both to pass
  ci-success:
    name: CI Success
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

