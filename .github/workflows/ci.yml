name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-tests:
    name: Backend Tests (PHP 8.3)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, xml, zip, intl, bcmath, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create .env file and JWT keys
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=ci-test-secret-not-for-production" >> .env
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env
          echo "DEFAULT_URI=http://localhost:8100" >> .env
          echo "CORS_ALLOW_ORIGIN='^https?://localhost(:[0-9]+)?$'" >> .env
          echo "MAILER_DSN=null://null" >> .env
          echo "SENTRY_DSN=" >> .env
          echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env
          # Generate JWT keys for testing
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem 2>/dev/null
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env
          echo "JWT_PASSPHRASE=" >> .env

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer dump-autoload --optimize

      - name: Check for security vulnerabilities
        run: composer audit

      - name: Run PHPUnit unit tests
        run: ./vendor/bin/phpunit --testdox --testsuite Unit

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # Optional: Run both jobs in parallel and require both to pass
  ci-success:
    name: CI Success
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # Build and push Docker images to GHCR (only on push to main)
  build-api-image:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://api.shopq.app
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production VPS after images are built
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api-image, build-frontend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 149.210.215.153
          username: root
          key: ${{ secrets.SHOPQ_SSH_KEY }}
          script: |
            cd /opt/shopq
            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Pulling Docker images..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api frontend

            echo "⏹️ Stopping containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod stop api frontend scheduler

            echo "📊 Running migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api php bin/console doctrine:migrations:migrate --no-interaction

            echo "🧹 Clearing cache..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api php bin/console cache:clear --env=prod

            echo "▶️ Starting containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            echo "🧹 Cleaning up..."
            docker image prune -f

            echo "✅ Deployment complete!"
