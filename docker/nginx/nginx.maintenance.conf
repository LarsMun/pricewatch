server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Return 503 for everything except health check
    error_page 503 /maintenance.html;

    location /maintenance.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Health check still works (for Docker healthcheck)
    location /health {
        access_log off;
        return 200 "maintenance\n";
        add_header Content-Type text/plain;
    }

    # All other requests return 503
    location / {
        return 503;
    }
}
