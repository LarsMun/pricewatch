services:
  # MariaDB Database (App)
  db:
    image: mariadb:11.2
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-pricewatch}
      MARIADB_USER: ${DB_USER:-pricewatch}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - internal

  # PHP Backend (Symfony API)
  api:
    image: ghcr.io/larsmun/pricewatch/api:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER:-pricewatch}:${DB_PASSWORD}@db:3306/${DB_DATABASE:-pricewatch}?serverVersion=mariadb-11.2.0
      MAILER_DSN: ${MAILER_DSN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      FRONTEND_URL: ${FRONTEND_URL:-https://shopq.app}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https://shopq\.app$}
      DEFAULT_URI: ${FRONTEND_URL:-https://shopq.app}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend/config/jwt:/var/www/html/config/jwt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.shopq.app`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  # React Frontend (serves /app/* routes)
  frontend:
    image: ghcr.io/larsmun/pricewatch/frontend:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # Frontend handles /app/* routes with higher priority
      - "traefik.http.routers.frontend.rule=Host(`shopq.app`) && PathPrefix(`/app`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.priority=20"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Strip /app prefix so React app receives clean paths
      - "traefik.http.middlewares.strip-app-prefix.stripprefix.prefixes=/app"
      - "traefik.http.routers.frontend.middlewares=strip-app-prefix"

  # WordPress CMS (landing page, marketing site)
  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://shopq.app');
        define('WP_SITEURL', 'https://shopq.app');
        define('FORCE_SSL_ADMIN', true);
        if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      wordpress-db:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      # WordPress handles all routes except /app/*
      - "traefik.http.routers.wordpress.rule=Host(`shopq.app`) || Host(`www.shopq.app`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wordpress.priority=10"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # Redirect www to non-www
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.routers.wordpress.middlewares=www-redirect"

  # WordPress Database
  wordpress-db:
    image: mariadb:11.2
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - wordpress-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Price check scheduler (cron)
  scheduler:
    image: ghcr.io/larsmun/pricewatch/api:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER:-pricewatch}:${DB_PASSWORD}@db:3306/${DB_DATABASE:-pricewatch}?serverVersion=mariadb-11.2.0
      MAILER_DSN: ${MAILER_DSN}
      DEFAULT_URI: ${FRONTEND_URL:-https://shopq.app}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      SENTRY_DSN: ${SENTRY_DSN:-}
    command: >
      sh -c "while true; do
        php bin/console app:check-prices --limit=50;
        sleep 300;
      done"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  db-data:
  wordpress-data:
  wordpress-db-data:

networks:
  internal:
    driver: bridge
  web:
    external: true
